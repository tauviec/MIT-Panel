# Generated by panel from plugins/apache/conf/httpd.conf
ServerRoot "{$SERVER_PATH}/apache"

Include {$SERVER_PATH}/web_conf/apache/listen.conf

{$LOAD_MODULES}

<IfModule unixd_module>
    User {$OS_USER}
    Group {$OS_USER_GROUP}
</IfModule>

ServerAdmin webmaster@localhost
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
UseCanonicalName Off
HostnameLookups Off
PidFile "logs/httpd.pid"

Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
LimitRequestBody 52428800

<IfModule mpm_event_module>
    ServerLimit 16
    ThreadLimit 64
    StartServers 3
    MinSpareThreads 75
    MaxSpareThreads 250
    ThreadsPerChild 25
    MaxRequestWorkers 400
    MaxConnectionsPerChild 0
</IfModule>

<IfModule mpm_prefork_module>
    StartServers 5
    MinSpareServers 5
    MaxSpareServers 10
    MaxRequestWorkers 250
    MaxConnectionsPerChild 0
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "{$SERVER_PATH}/apache/htdocs"
<Directory "{$SERVER_PATH}/apache/htdocs">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php index.html index.htm default.php default.htm default.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "logs/error_log"
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
</IfModule>

<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml
</IfModule>

<IfModule expires_module>
    ExpiresActive On
    ExpiresByType image/gif "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType text/css "access plus 12 hours"
    ExpiresByType application/javascript "access plus 12 hours"
</IfModule>

<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

<IfModule ssl_module>
    SSLRandomSeed startup builtin
    SSLRandomSeed connect builtin
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder On
    SSLSessionCache "shmcb:{$SERVER_PATH}/apache/logs/ssl_scache(512000)"
    SSLSessionCacheTimeout 300
</IfModule>

<IfModule proxy_module>
    ProxyRequests Off
    ProxyTimeout 300
</IfModule>

# Load status for the panel ("Load Status" menu), local requests only
<IfModule status_module>
    ExtendedStatus On
    <Location "/server-status">
        SetHandler server-status
        Require local
    </Location>
</IfModule>

IncludeOptional {$SERVER_PATH}/web_conf/apache/vhost/*.conf
