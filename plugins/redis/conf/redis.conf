# Redis configuration managed by MIT Panel
# Change the common options from the panel (Redis > Pengaturan);
# a restart is needed after editing this file by hand.

bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
pidfile {$SERVER_PATH}/redis.pid
loglevel notice
logfile {$SERVER_PATH}/redis.log
databases 16

requirepass {$REDIS_PASS}

maxclients 10000
maxmemory 0
maxmemory-policy noeviction

save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir {$SERVER_PATH}/data/

appendonly no
appendfilename "appendonly.aof"
appendfsync everysec
