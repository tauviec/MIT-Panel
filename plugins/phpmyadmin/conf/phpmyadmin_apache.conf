<VirtualHost *:888>
    ServerName 127.0.0.1
    DocumentRoot "{$SERVER_PATH}/phpmyadmin"
    ErrorLog "{$SERVER_PATH}/phpmyadmin/error.log"
    CustomLog "{$SERVER_PATH}/phpmyadmin/access.log" combined

    #PHP-INFO-START
    IncludeOptional {$PHP_CONF_PATH}/enable-php-{$PHP_VER}.conf
    #PHP-INFO-END

    <FilesMatch "\.(log|pass|json|pl)$">
        Require all denied
    </FilesMatch>

    <Directory "{$SERVER_PATH}/phpmyadmin">
        Options FollowSymLinks
        AllowOverride None
        DirectoryIndex index.php index.html index.htm
        AuthType Basic
        AuthName "Authorization"
        AuthUserFile "{$SERVER_PATH}/phpmyadmin/pma.pass"
        Require valid-user
    </Directory>
</VirtualHost>
