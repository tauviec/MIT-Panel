#BINDING-{$DIRBIND}-START
<VirtualHost *:{$PORT}>
    ServerAdmin webmaster@{$DIRBIND}
    DocumentRoot "{$ROOT_DIR}"
    ServerName {$DIRBIND}
    ErrorLog "{$LOGPATH}/{$SERVER_MAIN}_{$DIRBIND}.error.log"
    CustomLog "{$LOGPATH}/{$SERVER_MAIN}_{$DIRBIND}.log" combined

    #PHP-INFO-START
    IncludeOptional {$PHP_DIR}/enable-php-{$PHPVER}.conf
    #PHP-INFO-END

    <FilesMatch "^(\.user\.ini|\.git|\.svn|\.project|LICENSE|README\.md)$">
        Require all denied
    </FilesMatch>

    <Directory "{$ROOT_DIR}">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm default.php default.htm default.html
    </Directory>
</VirtualHost>
#BINDING-{$DIRBIND}-END
