<VirtualHost {$ADDRS}>
    ServerAdmin webmaster@{$SERVER_NAME}
    DocumentRoot "{$ROOT_DIR}"
    ServerName {$SERVER_NAME}
    ServerAlias {$SERVER_ALIAS}
    #errorDocument 404 /404.html
    ErrorLog "{$LOGPATH}/{$SERVER_NAME}.error.log"
    CustomLog "{$LOGPATH}/{$SERVER_NAME}.log" combined

    #HTTP_TO_HTTPS_START
    #HTTP_TO_HTTPS_END

    #301-START

    #PROXY-START

    #PHP-INFO-START
    IncludeOptional {$PHP_DIR}/enable-php-{$PHPVER}.conf
    #PHP-INFO-END

    #Forbidden file or directory
    <FilesMatch "^(\.user\.ini|\.git|\.svn|\.project|LICENSE|README\.md)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.(git|svn)(/|$)">
        Require all denied
    </DirectoryMatch>

    <Directory "{$ROOT_DIR}">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm default.php default.htm default.html
    </Directory>
</VirtualHost>
