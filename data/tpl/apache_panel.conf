<VirtualHost *:{$PORT}>
    ServerName {$SERVER_NAME}

    #HTTP_TO_HTTPS_START
    #HTTP_TO_HTTPS_END

    #PROXY-START
    <IfModule proxy_module>
        ProxyPreserveHost On
        ProxyPass "/" "http://127.0.0.1:{$PANAL_PORT}/" upgrade=websocket
        ProxyPassReverse "/" "http://127.0.0.1:{$PANAL_PORT}/"
    </IfModule>
    #PROXY-END

    #PHP-INFO-START
    #PHP-INFO-END

    ErrorLog "{$LOGPATH}/{$SERVER_NAME}.error.log"
</VirtualHost>
